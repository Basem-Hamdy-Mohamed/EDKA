name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python tools/edka.py validate examples/demo-wiki --strict --json edka-report.json
      - run: python tools/edka.py validate examples/lighting-escape-route --strict
      - run: EDKA_FUZZ_SAMPLE=300 python tests/fuzz_types.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edka-report
          path: edka-report.json
